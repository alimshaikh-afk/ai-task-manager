    <script type="module">

        const firebaseConfig = {
            apiKey: "AIzaSyDiy_mVFVhjZddTgM6kYELKc4uB_uygyoc",
            authDomain: "ai-personal-assistant-225fe.firebaseapp.com",
            projectId: "ai-personal-assistant-225fe",

<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useRef, useMemo } = React;

// ── Icons ──────────────────────────────────────────────────────────────────
const Icon = ({ d, size=18, className="" }) => (

const CheckCircle = ({size=18,className=""}) => <Icon size={size} className={className} d={<><path d="M12 22c5.523 0 10-4.477 10-10S17.523 2 12 2 2 6.477 2 12s4.477 10 10 10z"/><path d="m9 12 2 2 4-4"/></>}/>;
const Circle = ({size=18,className=""}) => <Icon size={size} className={className} d={<circle cx="12" cy="12" r="10"/>}/>;
const Trash = ({size=16,className=""}) => <Icon size={size} className={className} d={<><path d="M3 6h18M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/></>}/>;
const Send = ({size=16,className=""}) => <Icon size={size} className={className} d={<><path d="m22 2-7 20-4-9-9-4Z"/><path d="M22 2 11 13"/></>}/>;

const Sparkles = ({size=18,className=""}) => <Icon size={size} className={className} d={<><path d="m12 3-1.912 5.813a2 2 0 0 1-1.275 1.275L3 12l5.813 1.912a2 2 0 0 1 1.275 1.275L12 21l1.912-5.813a2 2 0 0 1 1.275-1.275L21 12l-5.813-1.912a2 2 0 0 1-1.275-1.275L12 3Z"/><path d="M5 3v4M3 5h4M6 17v4M4 19h4"/></>}/>;
const Bell = ({size=18,className=""}) => <Icon size={size} className={className} d={<><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></>}/>;
const SettingsIcon = ({size=18,className=""}) => <Icon size={size} className={className} d={<><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></>}/>;
const Brain = ({size=18,className=""}) => <Icon size={size} className={className} d={<><path d="M9.5 2A2.5 2.5 0 0 1 12 4.5v15a2.5 2.5 0 0 1-4.96-.46 2.5 2.5 0 0 1-1.04-4.69A2.5 2.5 0 0 1 4.5 9.5a2.5 2.5 0 0 1 2.16-2.47A2.5 2.5 0 0 1 9.5 2Z"/><path d="M14.5 2A2.5 2.5 0 0 0 12 4.5v15a2.5 2.5 0 0 0 4.96-.46 2.5 2.5 0 0 0 1.04-4.69A2.5 2.5 0 0 0 19.5 9.5a2.5 2.5 0 0 0-2.16-2.47A2.5 2.5 0 0 0 14.5 2Z"/></>}/>;
const Search = ({size=16,className=""}) => <Icon size={size} className={className} d={<><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></>}/>;
const Filter = ({size=16,className=""}) => <Icon size={size} className={className} d={<><polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"/></>}/>;
const ChevronDown = ({size=14,className=""}) => <Icon size={size} className={className} d={<path d="m6 9 6 6 6-6"/>}/>;
const ChevronRight = ({size=14,className=""}) => <Icon size={size} className={className} d={<path d="m9 18 6-6-6-6"/>}/>;
const User = ({size=14,className=""}) => <Icon size={size} className={className} d={<><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></>}/>;
const X = ({size=14,className=""}) => <Icon size={size} className={className} d={<><path d="M18 6 6 18"/><path d="m6 6 12 12"/></>}/>;
const Mail = ({size=16,className=""}) => <Icon size={size} className={className} d={<><rect width="20" height="16" x="2" y="4" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/></>}/>;
const Edit = ({size=14,className=""}) => <Icon size={size} className={className} d={<><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></>}/>;

// ── Firebase helpers ───────────────────────────────────────────────────────
const USER_ID = 'user_1771776063693_f3uvlvfzg';
async function fbSave(field, value) {
    if (!window.firebaseReady) return;
    try {
        const { doc, setDoc, deleteDoc } = window.firebaseModules;
        if (field === 'tasks') {
            // Save each task as its own document using task.id as doc ID
            for (const task of value) {
                await setDoc(doc(window.firebaseDb, 'users', USER_ID, 'tasks', task.id), task);
            }
        } else {
            await setDoc(doc(window.firebaseDb, 'users', USER_ID), { [field]: value }, { merge: true });
        }
    } catch(e) { console.warn('FB save error:', e); }
}

async function fbDeleteTask(taskId) {
    if (!window.firebaseReady) return;
    try {
        const { doc, deleteDoc } = window.firebaseModules;
        await deleteDoc(doc(window.firebaseDb, 'users', USER_ID, 'tasks', taskId));
    } catch(e) { console.warn('FB delete error:', e); }
}
async function fbLoadAll() {
    if (!window.firebaseReady) return null;
    try {
        const { doc, getDoc, collection, getDocs } = window.firebaseModules;
        // Load main document (messages, context, settings)
        const snap = await getDoc(doc(window.firebaseDb, 'users', USER_ID));
        const data = snap.exists() ? snap.data() : {};
        console.log('Loaded main doc for:', USER_ID, 'fields:', Object.keys(data));
        // Load tasks from subcollection
        const tasksSnap = await getDocs(collection(window.firebaseDb, 'users', USER_ID, 'tasks'));
        if (!tasksSnap.empty) {
            data.tasks = tasksSnap.docs.map(d => ({ ...d.data() }));
            console.log('Loaded', data.tasks.length, 'tasks from subcollection');
        }
        return data;
    } catch(e) { console.warn('FB load error:', e); }
    return null;
}

// ── Priority config ────────────────────────────────────────────────────────
const PRIORITY_ORDER = { high: 0, medium: 1, low: 2 };
const PRIORITY_COLORS = {
    high:   { card: 'bg-red-50 border-red-200',   badge: 'bg-red-100 text-red-700',    dot: 'bg-red-500' },
    medium: { card: 'bg-amber-50 border-amber-200', badge: 'bg-amber-100 text-amber-700', dot: 'bg-amber-400' },
    low:    { card: 'bg-emerald-50 border-emerald-200', badge: 'bg-emerald-100 text-emerald-700', dot: 'bg-emerald-500' },
};

// ── Customer color palette ─────────────────────────────────────────────────
const CUSTOMER_COLORS = [
    'bg-blue-100 text-blue-700 border-blue-200',
    'bg-violet-100 text-violet-700 border-violet-200',
    'bg-pink-100 text-pink-700 border-pink-200',
    'bg-cyan-100 text-cyan-700 border-cyan-200',
    'bg-orange-100 text-orange-700 border-orange-200',
    'bg-teal-100 text-teal-700 border-teal-200',
    'bg-indigo-100 text-indigo-700 border-indigo-200',
    'bg-rose-100 text-rose-700 border-rose-200',
];
function getCustomerColor(name, allCustomers) {
    const idx = allCustomers.sort().indexOf(name);
    return CUSTOMER_COLORS[idx % CUSTOMER_COLORS.length];
}

// ── Main App ───────────────────────────────────────────────────────────────
const TaskManager = () => {
    const [tasks, setTasks] = useState([]);
    const [messages, setMessages] = useState([]);
    const [context, setContext] = useState([]);
    const [inputMessage, setInputMessage] = useState('');
    const [isLoading, setIsLoading] = useState(false);
    const [fbLoading, setFbLoading] = useState(true);
    const [notificationsEnabled, setNotificationsEnabled] = useState(false);
    const [showSettings, setShowSettings] = useState(false);
    const [showContext, setShowContext] = useState(false);
    const [showAddTask, setShowAddTask] = useState(false);
    const [editingTask, setEditingTask] = useState(null);
    const [apiKey, setApiKey] = useState('');
    const [tempApiKey, setTempApiKey] = useState('');
    const [userEmail, setUserEmail] = useState('');
    const [tempEmail, setTempEmail] = useState('');
    const [emailStatus, setEmailStatus] = useState('');
    const [syncStatus, setSyncStatus] = useState('Loading...');

    // Filter/sort/search state
    const [searchQuery, setSearchQuery] = useState('');
    const [filterCustomer, setFilterCustomer] = useState('all');
    const [filterStatus, setFilterStatus] = useState('pending');
    const [sortBy, setSortBy] = useState('customer'); // customer | priority | dueDate | created
    const [groupByCustomer, setGroupByCustomer] = useState(true);
    const [collapsedGroups, setCollapsedGroups] = useState({});

    const messagesEndRef = useRef(null);
    const lastNotifDay = useRef({});

    // ── Load data ──────────────────────────────────────────────────────────
    useEffect(() => {
        async function load() {
            setFbLoading(true);
            if (window.firebaseReady) {
                const data = await fbLoadAll();
                if (data) {
                    if (data.tasks) setTasks(data.tasks);
                    if (data.messages && data.messages.length) setMessages(data.messages);
                    else setMessages([welcome()]);
                    if (data.context) setContext(data.context);
                    if (data.settings) {
                        if (data.settings.apiKey) setApiKey(data.settings.apiKey);
                        if (data.settings.email) setUserEmail(data.settings.email);
                    }
                    setSyncStatus('Synced ☁️');
                } else {
                    setMessages([welcome()]);
                    setSyncStatus('Synced ☁️');
                }
            } else {
                const s = localStorage;
                if (s.getItem('ai-tasks')) setTasks(JSON.parse(s.getItem('ai-tasks')));
                if (s.getItem('ai-messages')) setMessages(JSON.parse(s.getItem('ai-messages')));
                else setMessages([welcome()]);
                if (s.getItem('ai-context')) setContext(JSON.parse(s.getItem('ai-context')));
                if (s.getItem('anthropic-api-key')) setApiKey(s.getItem('anthropic-api-key'));
                if (s.getItem('user-email')) setUserEmail(s.getItem('user-email'));
                setSyncStatus('Local only');
            }
            setFbLoading(false);
            checkNotifPermission();
        }
        if (window.firebaseReady) load();
        else window.addEventListener('firebaseReady', load, { once: true });
        setTimeout(() => { if (fbLoading) load(); }, 3000);
    }, []);

    function welcome() {
        return { role: 'assistant', content: "Hi! I'm your AI assistant. Tell me what you need to do, ask about your tasks, or share context about your projects and customers.", timestamp: new Date().toISOString() };
    }

    // ── Notifications ──────────────────────────────────────────────────────
    useEffect(() => {
        const iv = setInterval(() => { checkScheduled(); checkTaskDue(); }, 60000);
        return () => clearInterval(iv);
    }, [tasks, notificationsEnabled]);

    function checkNotifPermission() {
        if ('Notification' in window) setNotificationsEnabled(Notification.permission === 'granted');
    }
    async function enableNotifications() {
        if ('Notification' in window) {
            const p = await Notification.requestPermission();
            setNotificationsEnabled(p === 'granted');
        }
    }
    function checkScheduled() {
        if (!notificationsEnabled) return;
        const now = new Date();
        const day = now.getDay();
        if (day === 5 || day === 6) return;
        const h = now.getHours(), m = now.getMinutes();
        const pending = tasks.filter(t => !t.completed);
        const slots = [{ h:10,m:0,label:'☀️ Morning Check-in' },{ h:14,m:0,label:'⏰ Afternoon Reminder' },{ h:17,m:30,label:'🌙 Evening Wrap-up' }];
        slots.forEach(s => {
            const key = now.toDateString()+s.h+s.m;
            if (h===s.h && m===s.m && !lastNotifDay.current[key]) {
                lastNotifDay.current[key] = true;
                new Notification(s.label, { body: `${pending.length} pending tasks. Click to open.` });
            }
        });
    }
    function checkTaskDue() {
        if (!notificationsEnabled) return;
        const now = new Date();
        tasks.forEach(t => {
            if (t.dueDate && !t.completed) {
                const diff = new Date(t.dueDate) - now;
                const key = 'due-'+t.id;
                if (diff > 0 && diff < 3600000 && !lastNotifDay.current[key]) {
                    lastNotifDay.current[key] = true;
                    new Notification('⏰ Due Soon', { body: `"${t.title}" is due in less than 1 hour!` });
                }
            }
        });
    }

    // ── Task CRUD ──────────────────────────────────────────────────────────
    function addTask(taskData) {
        const t = {
            id: Date.now().toString(36) + Math.random().toString(36).slice(2),
            title: taskData.title || 'Untitled',
            priority: taskData.priority || 'medium',
            dueDate: taskData.dueDate || null,
            customer: taskData.customer || null,
            category: taskData.category || null,
            notes: taskData.notes || null,
            completed: false,
            createdAt: new Date().toISOString()
        };
        setTasks(prev => {
            const updated = [...prev, t];
            localStorage.setItem('ai-tasks', JSON.stringify(updated));
            return updated;
        });
        // Save just this one task to Firebase
        fbSave('tasks', [t]);
        return t;
    }
    function updateTask(id, changes) {
        setTasks(prev => {
            const updated = prev.map(t => t.id === id ? { ...t, ...changes } : t);
            localStorage.setItem('ai-tasks', JSON.stringify(updated));
            const changedTask = updated.find(t => t.id === id);
            if (changedTask) fbSave('tasks', [changedTask]);
            return updated;
        });
    }
    function toggleTask(id) {
        setTasks(prev => {
            const updated = prev.map(t => t.id === id ? { ...t, completed: !t.completed } : t);
            localStorage.setItem('ai-tasks', JSON.stringify(updated));
            const changedTask = updated.find(t => t.id === id);
            if (changedTask) fbSave('tasks', [changedTask]);
            return updated;
        });
    }
    function deleteTask(id) {
        setTasks(prev => {
            const updated = prev.filter(t => t.id !== id);
            localStorage.setItem('ai-tasks', JSON.stringify(updated));
            return updated;
        });
        fbDeleteTask(id);
    }

    // ── Derived data ───────────────────────────────────────────────────────
    const allCustomers = useMemo(() => {
        const names = tasks.map(t => t.customer).filter(Boolean);
        return [...new Set(names)].sort();
    }, [tasks]);

    const filteredTasks = useMemo(() => {
        let result = [...tasks];
        // Status filter
        if (filterStatus === 'pending') result = result.filter(t => !t.completed);
        else if (filterStatus === 'completed') result = result.filter(t => t.completed);
        // Customer filter
        if (filterCustomer !== 'all') {
            if (filterCustomer === 'none') result = result.filter(t => !t.customer);
            else result = result.filter(t => t.customer === filterCustomer);
        }
        // Search
        if (searchQuery.trim()) {
            const q = searchQuery.toLowerCase();
            result = result.filter(t =>
                t.title.toLowerCase().includes(q) ||
                (t.customer && t.customer.toLowerCase().includes(q)) ||
                (t.notes && t.notes.toLowerCase().includes(q)) ||
                (t.category && t.category.toLowerCase().includes(q))
            );
        }
        // Sort
        result.sort((a, b) => {
            if (sortBy === 'priority') return PRIORITY_ORDER[a.priority] - PRIORITY_ORDER[b.priority];
            if (sortBy === 'dueDate') {
                if (!a.dueDate && !b.dueDate) return 0;
                if (!a.dueDate) return 1;
                if (!b.dueDate) return -1;
                return new Date(a.dueDate) - new Date(b.dueDate);
            }
            if (sortBy === 'customer') {
                const ca = a.customer || 'zzz', cb = b.customer || 'zzz';
                if (ca !== cb) return ca.localeCompare(cb);
                return PRIORITY_ORDER[a.priority] - PRIORITY_ORDER[b.priority];
            }
            return new Date(b.createdAt) - new Date(a.createdAt);
        });
        return result;
    }, [tasks, filterStatus, filterCustomer, searchQuery, sortBy]);

    const groupedTasks = useMemo(() => {
        if (!groupByCustomer) return { 'All Tasks': filteredTasks };
        const groups = {};
        filteredTasks.forEach(t => {
            const key = t.customer || '— No Customer';
            if (!groups[key]) groups[key] = [];
            groups[key].push(t);
        });
        return groups;
    }, [filteredTasks, groupByCustomer]);

    // ── AI Chat ────────────────────────────────────────────────────────────
    async function sendMessage() {
        if (!inputMessage.trim() || isLoading) return;
        if (!apiKey) { setShowSettings(true); return; }

        const userMsg = { role: 'user', content: inputMessage, timestamp: new Date().toISOString() };
        const newMessages = [...messages, userMsg];
        setMessages(newMessages);
        setInputMessage('');
        setIsLoading(true);

        try {
            const taskList = tasks.map(t =>
                `[${t.id}] ${t.title} | Priority: ${t.priority} | Customer: ${t.customer||'none'} | Status: ${t.completed?'DONE':'PENDING'}${t.dueDate?' | Due: '+t.dueDate:''}${t.notes?' | Notes: '+t.notes:''}`
            ).join('\n') || 'No tasks yet.';

            const contextList = context.length > 0 ? context.slice(-20).map(c=>'- '+c).join('\n') : 'None.';
            const customerList = allCustomers.length > 0 ? allCustomers.join(', ') : 'None yet.';

            const systemPrompt = `You are a personal AI assistant and task manager. You have full memory of the user's tasks, customers, and context.

CURRENT TASKS:
${taskList}

KNOWN CUSTOMERS: ${customerList}

STORED CONTEXT:
${contextList}

TODAY: ${new Date().toLocaleDateString('en-US', { weekday:'long', year:'numeric', month:'long', day:'numeric' })}

RESPONSE FORMAT RULES:

1. If user asks to SEE/LIST tasks → return { "response": "summary of tasks" }
   DO NOT include new_tasks when just listing.

2. If user asks to CREATE new tasks → return:
   { "response": "confirmation", "new_tasks": [{ "title":"...", "priority":"high|medium|low", "dueDate":"YYYY-MM-DD", "customer":"Customer Name", "category":"...", "notes":"..." }] }
   Only put BRAND NEW tasks in new_tasks. NEVER existing tasks.

3. If user shares context/info → return:
   { "response": "acknowledgment", "context": ["key fact"] }

4. General questions → { "response": "answer" }

IMPORTANT: Always extract customer names from user messages when creating tasks. If the user says "for Acme" or "Acme project", set customer to "Acme".`;

            const response = await fetch('/api/chat', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    apiKey,
                    system: systemPrompt,
                    messages: newMessages.slice(-15).map(m => ({ role: m.role, content: m.content }))
                })
            });

            const data = await response.json();
            if (data.error) throw new Error(data.error.message || data.error);

            const aiText = data.content[0].text;
            let parsed;
            try {
                parsed = JSON.parse(aiText.replace(/```json\n?|\n?```/g,'').trim());
            } catch(e1) {
                try {
                    const jsonMatch = aiText.match(/\{[\s\S]*\}/);
                    if (jsonMatch) {
                        parsed = JSON.parse(jsonMatch[0]);
                        const textBefore = aiText.slice(0, aiText.indexOf(jsonMatch[0])).trim();
                        if (textBefore && !parsed.response) parsed.response = textBefore;
                    } else {
                        parsed = { response: aiText };
                    }
                } catch(e2) {
                    parsed = { response: aiText };
                }
            }

            if (parsed.new_tasks && Array.isArray(parsed.new_tasks)) {
                parsed.new_tasks.forEach(t => addTask(t));
            }
            if (parsed.context && Array.isArray(parsed.context)) {
                const updated = [...context, ...parsed.context];
                setContext(updated);
                fbSave('context', updated);
                localStorage.setItem('ai-context', JSON.stringify(updated));
            }

            const assistantMsg = { role: 'assistant', content: parsed.response || aiText, timestamp: new Date().toISOString() };
            const updatedMsgs = [...newMessages, assistantMsg];
            setMessages(updatedMsgs);
            fbSave('messages', updatedMsgs);
            localStorage.setItem('ai-messages', JSON.stringify(updatedMsgs));

        } catch(e) {
            const errMsg = { role:'assistant', content:'⚠️ '+(e.message.includes('api_key')?'Invalid API key.':e.message), timestamp:new Date().toISOString() };
            const updatedMsgs = [...newMessages, errMsg];
            setMessages(updatedMsgs);
            fbSave('messages', updatedMsgs);
        }
        setIsLoading(false);
    }

    useEffect(() => { messagesEndRef.current?.scrollIntoView({ behavior:'smooth' }); }, [messages]);

    function saveSettings() {
        const key = tempApiKey.trim() || apiKey;
        const email = tempEmail.trim() || userEmail;
        setApiKey(key); setUserEmail(email);
        fbSave('settings', { apiKey: key, email });
        localStorage.setItem('anthropic-api-key', key);
        localStorage.setItem('user-email', email);
        setShowSettings(false); setTempApiKey(''); setTempEmail(''); setEmailStatus('');
    }

    async function sendTestEmail() {
        if (!userEmail) { alert('Add your email in Settings first.'); return; }
        setEmailStatus('Sending...');
        try {
            const pending = tasks.filter(t => !t.completed);
            const r = await fetch('/api/send-email', {
                method:'POST', headers:{'Content-Type':'application/json'},
                body: JSON.stringify({ to:userEmail, subject:'🧪 Test - Task Manager', tasks:pending, highPriority:pending.filter(t=>t.priority==='high').length, label:'Test Email' })
            });
            const d = await r.json();
            setEmailStatus(d.success ? '✅ Email sent!' : '❌ '+d.error);
        } catch(e) { setEmailStatus('❌ '+e.message); }
    }

    const pendingCount = tasks.filter(t => !t.completed).length;
    const highCount = tasks.filter(t => !t.completed && t.priority==='high').length;

    // ── Task Card ──────────────────────────────────────────────────────────
    const TaskCard = ({ task }) => {
        const pc = PRIORITY_COLORS[task.priority] || PRIORITY_COLORS.medium;
        const customerColor = task.customer ? getCustomerColor(task.customer, allCustomers) : '';
        return (
            <div className={`mb-2 p-3 rounded-xl border ${pc.card} group`}>
                <div className="flex items-start gap-2">
                    <button onClick={() => toggleTask(task.id)} className="mt-0.5 shrink-0 text-gray-400 hover:text-green-500 transition-colors">
                        {task.completed ? <CheckCircle size={18} className="text-green-500"/> : <Circle size={18}/>}
                    </button>
                    <div className="flex-1 min-w-0">
                        <p className={`text-sm font-medium leading-snug ${task.completed ? 'line-through text-gray-400' : 'text-gray-800'}`}>{task.title}</p>
                        <div className="flex flex-wrap gap-1.5 mt-1.5 items-center">
                            <span className={`text-xs px-1.5 py-0.5 rounded-full font-medium ${pc.badge}`}>{task.priority}</span>
                            {task.customer && (
                                <span className={`text-xs px-1.5 py-0.5 rounded-full border font-medium ${customerColor}`}>
                                    {task.customer}
                                </span>
                            )}
                            {task.dueDate && <span className="text-xs text-gray-500">📅 {new Date(task.dueDate+'T00:00:00').toLocaleDateString()}</span>}
                            {task.notes && <span className="text-xs text-gray-400 truncate max-w-32" title={task.notes}>💬 {task.notes}</span>}
                        </div>
                    </div>
                    <div className="flex gap-1 opacity-0 group-hover:opacity-100 transition-opacity shrink-0">
                        <button onClick={() => setEditingTask(task)} className="text-gray-300 hover:text-blue-500 transition-colors p-0.5">
                            <Edit size={13}/>
                        </button>
                        <button onClick={() => deleteTask(task.id)} className="text-gray-300 hover:text-red-500 transition-colors p-0.5">
                            <Trash size={13}/>
                        </button>
                    </div>
                </div>
            </div>
        );
    };

    // ── Task Form (Add/Edit) ───────────────────────────────────────────────
    const TaskForm = ({ task, onClose }) => {
        const [form, setForm] = useState({
            title: task?.title || '',
            priority: task?.priority || 'medium',
            dueDate: task?.dueDate || '',
            customer: task?.customer || '',
            category: task?.category || '',
            notes: task?.notes || '',
        });
        function save() {
            if (!form.title.trim()) return;
            if (task) updateTask(task.id, { ...form, customer: form.customer||null, dueDate: form.dueDate||null });
            else addTask(form);
            onClose();
        }
        return (
            <div className="fixed inset-0 bg-black/40 flex items-center justify-center z-50 p-4">
                <div className="bg-white rounded-2xl p-6 w-full max-w-md shadow-xl">
                    <h3 className="text-base font-bold mb-4">{task ? 'Edit Task' : '+ New Task'}</h3>
                    <div className="space-y-3">
                        <div>
                            <label className="text-xs font-medium text-gray-600 mb-1 block">Task Title *</label>
                            <input className="w-full px-3 py-2 border border-gray-200 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-purple-400" value={form.title} onChange={e=>setForm({...form,title:e.target.value})} placeholder="What needs to be done?" autoFocus/>
                        </div>
                        <div className="grid grid-cols-2 gap-3">
                            <div>
                                <label className="text-xs font-medium text-gray-600 mb-1 block">Customer</label>
                                <input className="w-full px-3 py-2 border border-gray-200 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-purple-400" value={form.customer} onChange={e=>setForm({...form,customer:e.target.value})} placeholder="e.g. Acme Corp" list="customer-list"/>
                                <datalist id="customer-list">{allCustomers.map(c=><option key={c} value={c}/>)}</datalist>
                            </div>
                            <div>
                                <label className="text-xs font-medium text-gray-600 mb-1 block">Priority</label>
                                <select className="w-full px-3 py-2 border border-gray-200 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-purple-400" value={form.priority} onChange={e=>setForm({...form,priority:e.target.value})}>
                                    <option value="high">🔴 High</option>
                                    <option value="medium">🟡 Medium</option>
                                    <option value="low">🟢 Low</option>
                                </select>
                            </div>
                        </div>
                        <div className="grid grid-cols-2 gap-3">
                            <div>
                                <label className="text-xs font-medium text-gray-600 mb-1 block">Due Date</label>
                                <input type="date" className="w-full px-3 py-2 border border-gray-200 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-purple-400" value={form.dueDate} onChange={e=>setForm({...form,dueDate:e.target.value})}/>
                            </div>
                            <div>
                                <label className="text-xs font-medium text-gray-600 mb-1 block">Category</label>
                                <input className="w-full px-3 py-2 border border-gray-200 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-purple-400" value={form.category} onChange={e=>setForm({...form,category:e.target.value})} placeholder="e.g. Meeting"/>
                            </div>
                        </div>
                        <div>
                            <label className="text-xs font-medium text-gray-600 mb-1 block">Notes</label>
                            <textarea className="w-full px-3 py-2 border border-gray-200 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-purple-400 resize-none" rows="2" value={form.notes} onChange={e=>setForm({...form,notes:e.target.value})} placeholder="Any additional notes..."/>
                        </div>
                    </div>
                    <div className="flex gap-2 mt-4">
                        <button onClick={onClose} className="flex-1 px-4 py-2 border border-gray-200 rounded-lg text-sm hover:bg-gray-50">Cancel</button>
                        <button onClick={save} className="flex-1 px-4 py-2 bg-purple-600 text-white rounded-lg text-sm hover:bg-purple-700 font-medium">Save Task</button>
                    </div>
                </div>
            </div>
        );
    };

    // ── Render ─────────────────────────────────────────────────────────────
    return (
        <>
        <div className="flex h-screen bg-gray-50 overflow-hidden">

            {/* ── LEFT: Task Panel ── */}
            <div className="w-5/12 bg-white border-r border-gray-100 flex flex-col min-w-0">

                {/* Header */}
                <div className="px-4 pt-4 pb-3 border-b border-gray-100">
                    <div className="flex items-center justify-between mb-2">
                        <div>
                            <h1 className="text-base font-bold text-gray-900 flex items-center gap-1.5">
                                <CheckCircle size={18} className="text-blue-500"/> My Tasks
                            </h1>
                            <p className="text-xs text-gray-400 mt-0.5">{syncStatus}</p>
                        </div>
                        <div className="flex gap-1">
                            <button onClick={() => setShowAddTask(true)} className="px-2.5 py-1.5 bg-purple-600 text-white text-xs font-medium rounded-lg hover:bg-purple-700 transition-colors">+ Add</button>
                            <button onClick={() => setShowContext(true)} className="p-1.5 hover:bg-gray-100 rounded-lg transition-colors"><Brain size={16} className="text-purple-400"/></button>
                            <button onClick={() => { setTempApiKey(''); setTempEmail(''); setEmailStatus(''); setShowSettings(true); }} className="p-1.5 hover:bg-gray-100 rounded-lg transition-colors"><SettingsIcon size={16} className="text-gray-400"/></button>
                        </div>
                    </div>

                    {/* Stats row */}
                    <div className="flex gap-2 mb-3">
                        <span className="text-xs bg-blue-50 text-blue-600 px-2 py-0.5 rounded-full font-medium">{pendingCount} pending</span>
                        {highCount > 0 && <span className="text-xs bg-red-50 text-red-600 px-2 py-0.5 rounded-full font-medium">🔥 {highCount} high</span>}
                        {allCustomers.length > 0 && <span className="text-xs bg-purple-50 text-purple-600 px-2 py-0.5 rounded-full font-medium">{allCustomers.length} customers</span>}
                    </div>

                    {/* Search */}
                    <div className="relative mb-2">
                        <Search size={13} className="absolute left-2.5 top-1/2 -translate-y-1/2 text-gray-400"/>
                        <input
                            className="w-full pl-7 pr-3 py-1.5 bg-gray-50 border border-gray-100 rounded-lg text-xs focus:outline-none focus:ring-2 focus:ring-purple-300 focus:bg-white"
                            placeholder="Search tasks, customers, notes..."
                            value={searchQuery}
                            onChange={e => setSearchQuery(e.target.value)}
                        />
                        {searchQuery && <button onClick={() => setSearchQuery('')} className="absolute right-2 top-1/2 -translate-y-1/2 text-gray-400 hover:text-gray-600"><X size={12}/></button>}
                    </div>

                    {/* Filter/Sort row */}
                    <div className="flex gap-1.5 flex-wrap">
                        {/* Status filter */}
                        <select className="text-xs px-2 py-1 border border-gray-100 rounded-lg bg-white focus:outline-none focus:ring-1 focus:ring-purple-300 text-gray-600" value={filterStatus} onChange={e => setFilterStatus(e.target.value)}>
                            <option value="all">All</option>
                            <option value="pending">Pending</option>
                            <option value="completed">Completed</option>
                        </select>

                        {/* Customer filter */}
                        <select className="text-xs px-2 py-1 border border-gray-100 rounded-lg bg-white focus:outline-none focus:ring-1 focus:ring-purple-300 text-gray-600 max-w-28" value={filterCustomer} onChange={e => setFilterCustomer(e.target.value)}>
                            <option value="all">All customers</option>
                            <option value="none">No customer</option>
                            {allCustomers.map(c => <option key={c} value={c}>{c}</option>)}
                        </select>

                        {/* Sort */}
                        <select className="text-xs px-2 py-1 border border-gray-100 rounded-lg bg-white focus:outline-none focus:ring-1 focus:ring-purple-300 text-gray-600" value={sortBy} onChange={e => setSortBy(e.target.value)}>
                            <option value="customer">Sort: Customer</option>
                            <option value="priority">Sort: Priority</option>
                            <option value="dueDate">Sort: Due Date</option>
                            <option value="created">Sort: Newest</option>
                        </select>

                        {/* Group toggle */}
                        <button onClick={() => setGroupByCustomer(g => !g)} className={`text-xs px-2 py-1 rounded-lg border transition-colors ${groupByCustomer ? 'bg-purple-50 border-purple-200 text-purple-600' : 'bg-white border-gray-100 text-gray-500'}`}>
                            <User size={11} className="inline mr-1"/>Group
                        </button>
                    </div>
                </div>

                {/* Task List */}
                <div className="flex-1 overflow-y-auto p-3 scrollbar-thin">
                    {fbLoading && (
                        <div className="flex items-center justify-center py-12 text-gray-400 text-sm">
                            <Loader size={18} className="animate-spin mr-2"/> Loading...
                        </div>
                    )}

                    {!fbLoading && filteredTasks.length === 0 && (
                        <div className="text-center py-12 text-gray-400">
                            <Circle size={36} className="mx-auto mb-2 opacity-30"/>
                            <p className="text-sm">{searchQuery || filterCustomer !== 'all' ? 'No tasks match your filters.' : 'No tasks yet. Add one or ask the AI!'}</p>
                        </div>
                    )}

                    {!fbLoading && Object.entries(groupedTasks).map(([group, groupTasks]) => (
                        <div key={group} className="mb-3">
                            {groupByCustomer && (
                                <button
                                    onClick={() => setCollapsedGroups(prev => ({ ...prev, [group]: !prev[group] }))}
                                    className="flex items-center gap-1.5 w-full text-left mb-1.5 px-1 py-0.5 hover:bg-gray-50 rounded-lg group"
                                >
                                    {collapsedGroups[group] ? <ChevronRight size={12} className="text-gray-400"/> : <ChevronDown size={12} className="text-gray-400"/>}
                                    <span className={`text-xs font-semibold px-2 py-0.5 rounded-full border ${group === '— No Customer' ? 'bg-gray-100 text-gray-500 border-gray-200' : getCustomerColor(group, allCustomers)}`}>
                                        {group === '— No Customer' ? group : <><User size={10} className="inline mr-1"/>{group}</>}
                                    </span>
                                    <span className="text-xs text-gray-400 ml-auto">{groupTasks.length}</span>
                                </button>
                            )}
                            {!collapsedGroups[group] && groupTasks.map(task => <TaskCard key={task.id} task={task}/>)}
                        </div>
                    ))}
                </div>

                {/* Notification bar */}
                <div className="px-3 pb-3">
                    {!notificationsEnabled ? (
                        <button onClick={enableNotifications} className="w-full flex items-center justify-center gap-1.5 px-3 py-2 bg-blue-600 text-white text-xs font-medium rounded-lg hover:bg-blue-700 transition-colors">
                            <Bell size={14}/> Enable Notifications
                        </button>
                    ) : (
                        <div className="flex items-center gap-1.5 text-xs text-green-600 bg-green-50 rounded-lg px-3 py-2">
                            <Bell size={13}/> <span>Notifications on</span>
                        </div>
                    )}
                </div>
            </div>

            {/* ── RIGHT: Chat Panel ── */}
            <div className="flex-1 flex flex-col bg-gradient-to-br from-slate-50 to-purple-50/30 min-w-0">
                <div className="px-5 py-4 bg-white border-b border-gray-100">
                    <h2 className="text-base font-bold text-gray-900 flex items-center gap-1.5">
                        <Sparkles size={18} className="text-purple-500"/> AI Personal Assistant
                    </h2>
                    <p className="text-xs text-gray-400 mt-0.5">{apiKey ? 'Ask about tasks, customers, or share context' : '⚙️ Add API key in Settings'}</p>
                </div>

                <div className="flex-1 overflow-y-auto p-4 space-y-3 scrollbar-thin">
                    {messages.map((msg, i) => (
                        <div key={i} className={`flex ${msg.role==='user'?'justify-end':'justify-start'}`}>
                            <div className={`max-w-sm lg:max-w-md p-3 rounded-2xl text-sm leading-relaxed ${msg.role==='user'?'bg-blue-600 text-white rounded-br-sm':'bg-white border border-gray-100 text-gray-800 shadow-sm rounded-bl-sm'}`}>
                                <p className="whitespace-pre-wrap">{msg.content}</p>
                                <p className={`text-xs mt-1 ${msg.role==='user'?'text-blue-200':'text-gray-400'}`}>
                                    {new Date(msg.timestamp).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})}
                                </p>
                            </div>
                        </div>
                    ))}
                    {isLoading && (
                        <div className="flex justify-start">
                            <div className="bg-white border border-gray-100 p-3 rounded-2xl shadow-sm">
                                <Loader size={18} className="animate-spin text-purple-500"/>
                            </div>
                        </div>
                    )}
                    <div ref={messagesEndRef}/>
                </div>

                {/* Quick actions */}
                <div className="px-4 pb-2 flex gap-1.5 flex-wrap">
                    {["What's on my plate?", "Show high priority", "Tasks by customer", "What's due this week?"].map(q => (
                        <button key={q} onClick={() => setInputMessage(q)} className="text-xs bg-white border border-gray-200 hover:border-purple-300 hover:text-purple-600 text-gray-500 px-2.5 py-1 rounded-full transition-colors">
                            {q}
                        </button>
                    ))}
                </div>

                <div className="p-4 bg-white border-t border-gray-100">
                    <div className="flex gap-2">
                        <input
                            type="text"
                            value={inputMessage}
                            onChange={e => setInputMessage(e.target.value)}
                            onKeyDown={e => e.key==='Enter' && !e.shiftKey && sendMessage()}
                            placeholder={apiKey ? "Tell me what you need, ask about your tasks..." : "Add API key in Settings..."}
                            className="flex-1 px-4 py-2.5 border border-gray-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-purple-400 focus:border-transparent"
                            disabled={isLoading}
                        />
                        <button onClick={sendMessage} disabled={isLoading||!inputMessage.trim()} className="px-4 py-2.5 bg-purple-600 text-white rounded-xl hover:bg-purple-700 disabled:opacity-40 disabled:cursor-not-allowed transition-colors">
                            <Send size={16}/>
                        </button>
                    </div>
                </div>
            </div>
        </div>

        {/* ── Modals ── */}
        {(showAddTask || editingTask) && (
            <TaskForm task={editingTask} onClose={() => { setShowAddTask(false); setEditingTask(null); }}/>
        )}

        {showSettings && (
            <div className="fixed inset-0 bg-black/40 flex items-center justify-center z-50 p-4">
                <div className="bg-white rounded-2xl p-6 w-full max-w-md shadow-xl">
                    <h3 className="text-base font-bold mb-4">⚙️ Settings</h3>
                    <label className="block text-xs font-medium text-gray-600 mb-1">Anthropic API Key</label>
                    <input type="password" value={tempApiKey} onChange={e=>setTempApiKey(e.target.value)} placeholder={apiKey?'••••••••••••':'sk-ant-api03-...'} className="w-full px-3 py-2 border border-gray-200 rounded-lg text-sm mb-1 focus:outline-none focus:ring-2 focus:ring-purple-400"/>
                    {apiKey && <p className="text-xs text-green-600 mb-3">✓ API key configured</p>}
                    <label className="block text-xs font-medium text-gray-600 mb-1 mt-3">Email for Reminders</label>
                    <input type="email" value={tempEmail} onChange={e=>setTempEmail(e.target.value)} placeholder={userEmail||'your@email.com'} className="w-full px-3 py-2 border border-gray-200 rounded-lg text-sm mb-1 focus:outline-none focus:ring-2 focus:ring-purple-400"/>
                    {userEmail && <p className="text-xs text-green-600 mb-1">✓ {userEmail}</p>}
                    <button onClick={sendTestEmail} className="flex items-center gap-1 text-xs text-purple-600 hover:text-purple-800 mt-1 mb-1"><Mail size={12}/> Send test email</button>
                    {emailStatus && <p className="text-xs mb-2">{emailStatus}</p>}
                    <p className="text-xs text-gray-400 mb-4">Reminders: 10 AM, 2 PM, 5:30 PM (Sun–Thu)</p>
                    <div className="flex gap-2">
                        <button onClick={()=>setShowSettings(false)} className="flex-1 px-4 py-2 border border-gray-200 rounded-lg text-sm hover:bg-gray-50">Cancel</button>
                        <button onClick={saveSettings} className="flex-1 px-4 py-2 bg-purple-600 text-white rounded-lg text-sm hover:bg-purple-700 font-medium">Save</button>
                    </div>
                </div>
            </div>
        )}

        {showContext && (
            <div className="fixed inset-0 bg-black/40 flex items-center justify-center z-50 p-4">
                <div className="bg-white rounded-2xl p-6 w-full max-w-md shadow-xl max-h-[80vh] flex flex-col">
                    <div className="flex items-center justify-between mb-4">
                        <h3 className="text-base font-bold flex items-center gap-2"><Brain size={18} className="text-purple-500"/> Context Memory</h3>
                        <button onClick={()=>setShowContext(false)} className="text-gray-400 hover:text-gray-600"><X size={18}/></button>
                    </div>
                    <div className="flex-1 overflow-y-auto scrollbar-thin">
                        {context.length === 0
                            ? <p className="text-sm text-gray-400 text-center py-8">No context stored yet.</p>
                            : <ul className="space-y-2">{context.map((c,i)=><li key={i} className="text-sm bg-purple-50 border border-purple-100 rounded-lg px-3 py-2 text-purple-800">{c}</li>)}</ul>
                        }
                    </div>
                    {context.length > 0 && (
                        <button onClick={()=>{setContext([]);fbSave('context',[]);localStorage.removeItem('ai-context');}} className="mt-4 text-xs text-red-400 hover:text-red-600">
                            Clear all context
                        </button>
                    )}
                </div>
            </div>
        )}
        </>
    );
};

ReactDOM.render(<TaskManager/>, document.getElementById('root'));
</script>
</body>
</html>
