<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Personal Assistant</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif; }
        #root { height: 100vh; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="module">
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js';
        import { getFirestore, collection, doc, setDoc, deleteDoc, onSnapshot, query, orderBy } from 'https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js';
        
        const firebaseConfig = {
            apiKey: "AIzaSyDiy_mVFVhjZddTgM6kYELKc4uB_uygyoc",
            authDomain: "ai-personal-assistant-225fe.firebaseapp.com",
            projectId: "ai-personal-assistant-225fe",
            storageBucket: "ai-personal-assistant-225fe.firebasestorage.app",
            messagingSenderId: "564158119450",
            appId: "1:564158119450:web:ce50c57e2832876dfd5ba3"
        };
        
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        
        window.firebaseDb = db;
        window.firebaseCollection = collection;
        window.firebaseDoc = doc;
        window.firebaseSetDoc = setDoc;
        window.firebaseDeleteDoc = deleteDoc;
        window.firebaseOnSnapshot = onSnapshot;
        window.firebaseQuery = query;
        window.firebaseOrderBy = orderBy;
        window.firebaseReady = true;
    </script>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        const CheckCircle2 = ({ size = 24, className = "" }) => (<svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M12 22c5.523 0 10-4.477 10-10S17.523 2 12 2 2 6.477 2 12s4.477 10 10 10z"/><path d="m9 12 2 2 4-4"/></svg>);
        const Circle = ({ size = 24 }) => (<svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><circle cx="12" cy="12" r="10"/></svg>);
        const Trash2 = ({ size = 24 }) => (<svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M3 6h18M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/></svg>);
        const Send = ({ size = 24 }) => (<svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="m22 2-7 20-4-9-9-4Z"/><path d="M22 2 11 13"/></svg>);
        const Loader2 = ({ size = 24, className = "" }) => (<svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M21 12a9 9 0 1 1-6.219-8.56"/></svg>);
        const Sparkles = ({ size = 24, className = "" }) => (<svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="m12 3-1.912 5.813a2 2 0 0 1-1.275 1.275L3 12l5.813 1.912a2 2 0 0 1 1.275 1.275L12 21l1.912-5.813a2 2 0 0 1 1.275-1.275L21 12l-5.813-1.912a2 2 0 0 1-1.275-1.275L12 3Z"/><path d="M5 3v4M3 5h4M6 17v4M4 19h4"/></svg>);
        const Bell = ({ size = 24 }) => (<svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg>);
        const Settings = ({ size = 24, className = "" }) => (<svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg>);
        const Brain = ({ size = 24, className = "" }) => (<svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M9.5 2A2.5 2.5 0 0 1 12 4.5v15a2.5 2.5 0 0 1-4.96.44 2.5 2.5 0 0 1-2.96-3.08 3 3 0 0 1-.34-5.58 2.5 2.5 0 0 1 1.32-4.24 2.5 2.5 0 0 1 1.98-3A2.5 2.5 0 0 1 9.5 2Z"/><path d="M14.5 2A2.5 2.5 0 0 0 12 4.5v15a2.5 2.5 0 0 0 4.96.44 2.5 2.5 0 0 0 2.96-3.08 3 3 0 0 0 .34-5.58 2.5 2.5 0 0 0-1.32-4.24 2.5 2.5 0 0 0-1.98-3A2.5 2.5 0 0 0 14.5 2Z"/></svg>);
        const Cloud = ({ size = 24, className = "" }) => (<svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M17.5 19H9a7 7 0 1 1 6.71-9h1.79a4.5 4.5 0 1 1 0 9Z"/></svg>);

        const AssistantApp = () => {
            const [tasks, setTasks] = useState([]);
            const [messages, setMessages] = useState([]);
            const [contextNotes, setContextNotes] = useState([]);
            const [inputMessage, setInputMessage] = useState('');
            const [isLoading, setIsLoading] = useState(false);
            const [notificationsEnabled, setNotificationsEnabled] = useState(false);
            const [showApiKeyModal, setShowApiKeyModal] = useState(false);
            const [showContextModal, setShowContextModal] = useState(false);
            const [showSettingsModal, setShowSettingsModal] = useState(false);
            const [apiKey, setApiKey] = useState('');
            const [userEmail, setUserEmail] = useState('');
            const [tempApiKey, setTempApiKey] = useState('');
            const [tempEmail, setTempEmail] = useState('');
            const [userId, setUserId] = useState('');
            const [cloudSynced, setCloudSynced] = useState(false);
            const messagesEndRef = useRef(null);

            const notificationTimes = [
                { hour: 10, minute: 0, label: 'Morning Check-in' },
                { hour: 14, minute: 0, label: 'Afternoon Reminder' },
                { hour: 17, minute: 30, label: 'Evening Wrap-up' }
            ];

            useEffect(() => {
                initializeUser();
                loadLocalData();
                checkNotificationPermission();
                
                const checkFirebase = setInterval(() => {
                    if (window.firebaseReady && userId) {
                        clearInterval(checkFirebase);
                        syncWithFirebase();
                    }
                }, 100);

                const notifInterval = setInterval(() => {
                    checkReminders();
                    checkScheduledNotifications();
                }, 60000);

                return () => {
                    clearInterval(checkFirebase);
                    clearInterval(notifInterval);
                };
            }, []);

            useEffect(() => {
                if (userId && window.firebaseReady) {
                    syncWithFirebase();
                }
            }, [userId]);

            const initializeUser = () => {
                let uid = localStorage.getItem('user-id');
                if (!uid) {
                    uid = 'user_' + Date.now() + '_' + Math.random().toString(36).substr(2, 9);
                    localStorage.setItem('user-id', uid);
                }
                setUserId(uid);
            };

            const loadLocalData = () => {
                try {
                    const storedApiKey = localStorage.getItem('anthropic-api-key');
                    const storedEmail = localStorage.getItem('user-email');
                    if (storedApiKey) setApiKey(storedApiKey);
                    if (storedEmail) setUserEmail(storedEmail);
                } catch (error) {
                    console.log('Error loading local data');
                }
            };

            const syncWithFirebase = () => {
                if (!window.firebaseDb || !userId || !window.firebaseReady) return;

                try {
                    // Tasks
                    const tasksRef = window.firebaseCollection(window.firebaseDb, `users/${userId}/tasks`);
                    window.firebaseOnSnapshot(tasksRef, (snapshot) => {
                        const tasksList = [];
                        snapshot.forEach((doc) => {
                            tasksList.push({ id: doc.id, ...doc.data() });
                        });
                        setTasks(tasksList);
                        setCloudSynced(true);
                    });

                    // Context
                    const contextRef = window.firebaseCollection(window.firebaseDb, `users/${userId}/context`);
                    window.firebaseOnSnapshot(contextRef, (snapshot) => {
                        const contextList = [];
                        snapshot.forEach((doc) => {
                            contextList.push({ id: doc.id, ...doc.data() });
                        });
                        setContextNotes(contextList);
                    });

                    // Messages
                    const messagesRef = window.firebaseCollection(window.firebaseDb, `users/${userId}/messages`);
                    const messagesQuery = window.firebaseQuery(messagesRef, window.firebaseOrderBy('timestamp', 'asc'));
                    window.firebaseOnSnapshot(messagesQuery, (snapshot) => {
                        const messagesList = [];
                        snapshot.forEach((doc) => {
                            messagesList.push({ id: doc.id, ...doc.data() });
                        });
                        
                        if (messagesList.length === 0) {
                            const welcomeMsg = {
                                id: 'welcome',
                                role: 'assistant',
                                content: "Hi! I'm your AI personal assistant with cloud sync! 🌐\n\n✅ Your data syncs across all devices\n✅ Email reminders at 10 AM, 2 PM, 5:30 PM\n✅ Full context memory\n\nTry: 'What's on my plate?' or share your projects!",
                                timestamp: new Date().toISOString()
                            };
                            setMessages([welcomeMsg]);
                            saveMessageToCloud(welcomeMsg);
                        } else {
                            setMessages(messagesList);
                        }
                    });

                } catch (error) {
                    console.error('Firebase sync error:', error);
                }
            };

            const saveTaskToCloud = async (task) => {
                if (!window.firebaseDb || !userId || !window.firebaseReady) return;
                try {
                    const docRef = window.firebaseDoc(window.firebaseDb, `users/${userId}/tasks`, task.id);
                    await window.firebaseSetDoc(docRef, task);
                } catch (error) {
                    console.error('Error saving task:', error);
                }
            };

            const deleteTaskFromCloud = async (taskId) => {
                if (!window.firebaseDb || !userId || !window.firebaseReady) return;
                try {
                    const docRef = window.firebaseDoc(window.firebaseDb, `users/${userId}/tasks`, taskId);
                    await window.firebaseDeleteDoc(docRef);
                } catch (error) {
                    console.error('Error deleting task:', error);
                }
            };

            const saveContextToCloud = async (note) => {
                if (!window.firebaseDb || !userId || !window.firebaseReady) return;
                try {
                    const docRef = window.firebaseDoc(window.firebaseDb, `users/${userId}/context`, note.id);
                    await window.firebaseSetDoc(docRef, note);
                } catch (error) {
                    console.error('Error saving context:', error);
                }
            };

            const deleteContextFromCloud = async (noteId) => {
                if (!window.firebaseDb || !userId || !window.firebaseReady) return;
                try {
                    const docRef = window.firebaseDoc(window.firebaseDb, `users/${userId}/context`, noteId);
                    await window.firebaseDeleteDoc(docRef);
                } catch (error) {
                    console.error('Error deleting context:', error);
                }
            };

            const saveMessageToCloud = async (message) => {
                if (!window.firebaseDb || !userId || !window.firebaseReady) return;
                try {
                    const docRef = window.firebaseDoc(window.firebaseDb, `users/${userId}/messages`, message.id || Date.now().toString());
                    await window.firebaseSetDoc(docRef, message);
                } catch (error) {
                    console.error('Error saving message:', error);
                }
            };

            const saveApiKey = (key) => {
                localStorage.setItem('anthropic-api-key', key);
                setApiKey(key);
            };

            const saveEmail = (email) => {
                localStorage.setItem('user-email', email);
                setUserEmail(email);
            };

            const checkNotificationPermission = () => {
                if ('Notification' in window) {
                    setNotificationsEnabled(Notification.permission === 'granted');
                }
            };

            const requestNotificationPermission = async () => {
                if ('Notification' in window) {
                    const permission = await Notification.requestPermission();
                    setNotificationsEnabled(permission === 'granted');
                    if (permission === 'granted') {
                        showNotification('Notifications Enabled!', 'Daily reminders at 10 AM, 2 PM, 5:30 PM');
                    }
                }
            };

            const checkScheduledNotifications = () => {
                if (!notificationsEnabled) return;

                const now = new Date();
                const day = now.getDay();
                if (day === 5 || day === 6) return;

                const currentHour = now.getHours();
                const currentMinute = now.getMinutes();

                notificationTimes.forEach(time => {
                    if (currentHour === time.hour && currentMinute === time.minute) {
                        const lastNotifKey = `last-notif-${time.hour}-${time.minute}`;
                        const lastNotif = localStorage.getItem(lastNotifKey);
                        const today = now.toDateString();

                        if (lastNotif !== today) {
                            sendScheduledNotification(time.label);
                            sendEmailReminder(time.label);
                            localStorage.setItem(lastNotifKey, today);
                        }
                    }
                });
            };

            const sendEmailReminder = async (label) => {
                if (!userEmail) return;

                const pendingTasks = tasks.filter(t => !t.completed);
                const highPriority = pendingTasks.filter(t => t.priority === 'high');
                
                try {
                    await fetch('/api/send-email', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            to: userEmail,
                            subject: `${label} - Task Manager`,
                            tasks: pendingTasks,
                            highPriority: highPriority.length,
                            label: label
                        })
                    });
                } catch (error) {
                    console.log('Email send skipped:', error);
                }
            };

            const sendScheduledNotification = (label) => {
                const pendingTasks = tasks.filter(t => !t.completed);
                const highPriority = pendingTasks.filter(t => t.priority === 'high').length;
                
                let message = '';
                if (label === 'Morning Check-in') {
                    message = `Good morning! ${pendingTasks.length} task${pendingTasks.length !== 1 ? 's' : ''}.${highPriority > 0 ? ` ${highPriority} high priority.` : ''}`;
                } else if (label === 'Afternoon Reminder') {
                    message = `Afternoon: ${pendingTasks.length} task${pendingTasks.length !== 1 ? 's' : ''} pending.`;
                } else if (label === 'Evening Wrap-up') {
                    message = `End of day: ${pendingTasks.length} pending.`;
                }

                showNotification(label, message);
            };

            const checkReminders = () => {
                const now = new Date();
                tasks.forEach(task => {
                    if (task.reminder && !task.completed && notificationsEnabled) {
                        const reminderTime = new Date(task.reminder);
                        const diff = reminderTime - now;
                        if (diff > 0 && diff < 60000) {
                            showNotification('Task Reminder', task.title);
                        }
                    }
                });
            };

            const showNotification = (title, body) => {
                if (!notificationsEnabled || !('Notification' in window)) return;
                new Notification(title, { body: body });
            };

            const sendTestNotification = () => {
                if (!userEmail) {
                    alert('Please add your email in Settings first!');
                    setShowSettingsModal(true);
                    return;
                }

                try {
                    const pendingTasks = tasks.filter(t => !t.completed);
                    const highPriority = pendingTasks.filter(t => t.priority === 'high');
                    
                    const response = await fetch('/api/send-email', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            to: userEmail,
                            subject: 'Test Email - Task Manager',
                            tasks: pendingTasks.length > 0 ? pendingTasks : [{ title: 'Sample task', priority: 'medium' }],
                            highPriority: highPriority.length,
                            label: 'Test Email'
                        })
                    });

                    const data = await response.json();
                    
                    if (data.success) {
                        alert(`✅ Test email sent to ${userEmail}! Check your inbox (and spam folder).`);
                    } else {
                        alert(`❌ Error: ${data.error || 'Failed to send email'}`);
                        console.error('Email error:', data);
                    }
                } catch (error) {
                    alert(`❌ Error sending email: ${error.message}`);
                    console.error('Email send error:', error);
                }
            };
                if (!notificationsEnabled) {
                    alert('Please enable notifications first!');
                    return;
                }
                if (!('Notification' in window)) {
                    alert('Your browser does not support notifications');
                    return;
                }
                try {
                    new Notification('🔔 Test Notification', {
                        body: `You have ${pendingTasks.length} pending task${pendingTasks.length !== 1 ? 's' : ''}. Notifications are working!`,
                        icon: '✓',
                        requireInteraction: false
                    });
                    console.log('Test notification sent successfully');
                } catch (error) {
                    console.error('Notification error:', error);
                    alert('Error sending notification: ' + error.message);
                }
            };

            const addTask = (taskData) => {
                const newTask = {
                    id: Date.now().toString(),
                    title: taskData.title,
                    priority: taskData.priority || 'medium',
                    dueDate: taskData.dueDate || null,
                    category: taskData.category || 'General',
                    completed: false,
                    createdAt: new Date().toISOString()
                };
                saveTaskToCloud(newTask);
            };

            const addContextNote = (note) => {
                const newNote = {
                    id: Date.now().toString(),
                    content: note,
                    timestamp: new Date().toISOString()
                };
                saveContextToCloud(newNote);
            };

            const deleteContextNote = (id) => {
                deleteContextFromCloud(id);
            };

            const toggleTask = (id) => {
                const task = tasks.find(t => t.id === id);
                if (task) {
                    const updatedTask = { ...task, completed: !task.completed };
                    saveTaskToCloud(updatedTask);
                }
            };

            const deleteTask = (id) => {
                deleteTaskFromCloud(id);
            };

            const sendMessage = async () => {
                if (!inputMessage.trim() || isLoading) return;
                if (!apiKey) {
                    setShowSettingsModal(true);
                    return;
                }

                const userMessage = {
                    id: Date.now().toString(),
                    role: 'user',
                    content: inputMessage,
                    timestamp: new Date().toISOString()
                };

                saveMessageToCloud(userMessage);
                setInputMessage('');
                setIsLoading(true);

                try {
                    const taskContext = tasks.map(t => 
                        `- ${t.title} (${t.priority}, ${t.completed ? 'done' : 'pending'}${t.dueDate ? ', due: ' + new Date(t.dueDate).toLocaleDateString() : ''})`
                    ).join('\n');

                    const contextInfo = contextNotes.map(n => `- ${n.content}`).join('\n');

                    const systemPrompt = `You are a personal AI assistant with full context memory.

CURRENT TASKS:
${taskContext || 'None'}

CONTEXT:
${contextInfo || 'None'}

Respond with JSON: {"response":"message","tasks":[{"title":"","priority":"high|medium|low","dueDate":"YYYY-MM-DD","category":""}],"context_notes":["note"]}`;

                    const response = await fetch('/api/chat', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            apiKey: apiKey,
                            system: systemPrompt,
                            messages: messages.slice(-20).map(m => ({ role: m.role, content: m.content })).concat([{ role: 'user', content: inputMessage }])
                        })
                    });

                    const data = await response.json();
                    if (data.error) throw new Error(data.error);

                    const aiResponse = data.content[0].text;
                    let parsedResponse;
                    try {
                        parsedResponse = JSON.parse(aiResponse.replace(/```json\n?|\n?```/g, '').trim());
                    } catch {
                        parsedResponse = { response: aiResponse };
                    }

                    if (parsedResponse.tasks) {
                        parsedResponse.tasks.forEach(t => addTask(t));
                    }
                    if (parsedResponse.context_notes) {
                        parsedResponse.context_notes.forEach(note => addContextNote(note));
                    }

                    const assistantMessage = {
                        id: (Date.now() + 1).toString(),
                        role: 'assistant',
                        content: parsedResponse.response,
                        timestamp: new Date().toISOString()
                    };
                    saveMessageToCloud(assistantMessage);

                } catch (error) {
                    const errorMessage = {
                        id: (Date.now() + 1).toString(),
                        role: 'assistant',
                        content: "Error: " + error.message,
                        timestamp: new Date().toISOString()
                    };
                    saveMessageToCloud(errorMessage);
                }
                setIsLoading(false);
            };

            useEffect(() => {
                messagesEndRef.current?.scrollIntoView({ behavior: 'smooth' });
            }, [messages]);

            const priorityColors = {
                high: 'bg-red-100 text-red-800 border-red-300',
                medium: 'bg-yellow-100 text-yellow-800 border-yellow-300',
                low: 'bg-green-100 text-green-800 border-green-300'
            };

            const pendingTasks = tasks.filter(t => !t.completed);
            const completedTasks = tasks.filter(t => t.completed);
            const highPriorityTasks = pendingTasks.filter(t => t.priority === 'high');

            return (
                <>
                    <div className="flex h-screen bg-gray-50">
                        <div className="w-2/5 bg-white border-r border-gray-200 flex flex-col">
                            <div className="p-6 border-b border-gray-200">
                                <div className="flex items-center justify-between mb-4">
                                    <div>
                                        <h1 className="text-2xl font-bold text-gray-900 flex items-center gap-2">
                                            <CheckCircle2 size={24} className="text-blue-600" />
                                            My Tasks
                                        </h1>
                                        <p className="text-sm text-gray-600 mt-1">
                                            {pendingTasks.length} pending · {completedTasks.length} completed
                                        </p>
                                        {cloudSynced && (
                                            <p className="text-xs text-green-600 mt-1 flex items-center gap-1">
                                                <Cloud size={12} /> Synced to cloud
                                            </p>
                                        )}
                                    </div>
                                    <div className="flex gap-2">
                                        <button onClick={() => setShowContextModal(true)} className="p-2 hover:bg-gray-100 rounded-lg">
                                            <Brain size={20} className="text-purple-600" />
                                        </button>
                                        <button onClick={() => setShowSettingsModal(true)} className="p-2 hover:bg-gray-100 rounded-lg">
                                            <Settings size={20} className="text-gray-600" />
                                        </button>
                                    </div>
                                </div>

                                {highPriorityTasks.length > 0 && (
                                    <div className="bg-red-50 border border-red-200 rounded-lg p-3">
                                        <p className="text-sm font-semibold text-red-800">🔥 {highPriorityTasks.length} High Priority</p>
                                    </div>
                                )}
                            </div>

                            <div className="flex-1 overflow-y-auto p-6 space-y-4">
                                {pendingTasks.length === 0 && completedTasks.length === 0 && (
                                    <div className="text-center py-12 text-gray-400">
                                        <Circle size={48} />
                                        <p className="mt-3">No tasks yet!</p>
                                    </div>
                                )}

                                {pendingTasks.length > 0 && (
                                    <div>
                                        <h3 className="text-xs font-semibold text-gray-500 uppercase mb-3">Pending</h3>
                                        {pendingTasks.map(task => (
                                            <div key={task.id} className={`mb-3 p-4 rounded-lg border-2 ${priorityColors[task.priority]}`}>
                                                <div className="flex items-start gap-3">
                                                    <button onClick={() => toggleTask(task.id)} className="mt-1">
                                                        <Circle size={20} />
                                                    </button>
                                                    <div className="flex-1">
                                                        <p className="font-medium">{task.title}</p>
                                                        <div className="flex gap-3 mt-2 text-xs">
                                                            {task.category && <span className="opacity-75">📁 {task.category}</span>}
                                                            {task.dueDate && <span className="opacity-75">📅 {new Date(task.dueDate).toLocaleDateString()}</span>}
                                                        </div>
                                                    </div>
                                                    <button onClick={() => deleteTask(task.id)} className="text-red-600 hover:text-red-800">
                                                        <Trash2 size={18} />
                                                    </button>
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                )}

                                {completedTasks.length > 0 && (
                                    <div>
                                        <h3 className="text-xs font-semibold text-gray-500 uppercase mb-3">Completed</h3>
                                        {completedTasks.map(task => (
                                            <div key={task.id} className="mb-3 p-4 rounded-lg border-2 border-gray-200 bg-gray-50">
                                                <div className="flex items-start gap-3">
                                                    <button onClick={() => toggleTask(task.id)} className="mt-1">
                                                        <CheckCircle2 size={20} className="text-green-600" />
                                                    </button>
                                                    <div className="flex-1">
                                                        <p className="font-medium line-through text-gray-500">{task.title}</p>
                                                    </div>
                                                    <button onClick={() => deleteTask(task.id)} className="text-red-600 hover:text-red-800">
                                                        <Trash2 size={18} />
                                                    </button>
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                )}
                            </div>

                            <div className="p-4 bg-blue-50 border-t border-blue-200">
                                {!notificationsEnabled ? (
                                    <>
                                        <p className="text-xs text-blue-800 mb-2">Enable daily reminders</p>
                                        <button onClick={requestNotificationPermission} className="w-full flex items-center justify-center gap-2 px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700">
                                            <Bell size={18} />
                                            Enable Notifications
                                        </button>
                                    </>
                                ) : (
                                    <>
                                        <p className="text-xs text-green-800 mb-2">✓ Notifications enabled</p>
                                        <button onClick={sendTestNotification} className="w-full flex items-center justify-center gap-2 px-4 py-2 bg-green-600 text-white rounded-lg hover:bg-green-700">
                                            <Bell size={18} />
                                            Send Test Notification
                                        </button>
                                    </>
                                )}
                            </div>
                        </div>

                        <div className="flex-1 flex flex-col bg-gradient-to-br from-blue-50 to-purple-50">
                            <div className="p-6 bg-white border-b border-gray-200">
                                <h2 className="text-xl font-bold text-gray-900 flex items-center gap-2">
                                    <Sparkles size={24} className="text-purple-600" />
                                    AI Assistant
                                </h2>
                                <p className="text-sm text-gray-600 mt-1">
                                    {apiKey ? 'Cloud sync • Email reminders' : 'Add API key to enable'}
                                </p>
                            </div>

                            <div className="flex-1 overflow-y-auto p-6 space-y-4">
                                {messages.map((msg, idx) => (
                                    <div key={idx} className={`flex ${msg.role === 'user' ? 'justify-end' : 'justify-start'}`}>
                                        <div className={`max-w-lg p-4 rounded-lg ${msg.role === 'user' ? 'bg-blue-600 text-white' : 'bg-white border border-gray-200 text-gray-800'}`}>
                                            <p className="whitespace-pre-wrap">{msg.content}</p>
                                        </div>
                                    </div>
                                ))}
                                {isLoading && (
                                    <div className="flex justify-start">
                                        <div className="bg-white border border-gray-200 p-4 rounded-lg">
                                            <Loader2 size={24} className="animate-spin text-purple-600" />
                                        </div>
                                    </div>
                                )}
                                <div ref={messagesEndRef} />
                            </div>

                            <div className="p-6 bg-white border-t border-gray-200">
                                <div className="flex gap-2 mb-3">
                                    <button onClick={() => setInputMessage("What's on my plate?")} className="px-3 py-1 text-xs bg-gray-100 hover:bg-gray-200 rounded-full">
                                        What's on my plate?
                                    </button>
                                </div>
                                <div className="flex gap-3">
                                    <input
                                        type="text"
                                        value={inputMessage}
                                        onChange={(e) => setInputMessage(e.target.value)}
                                        onKeyPress={(e) => e.key === 'Enter' && sendMessage()}
                                        placeholder={apiKey ? "Tell me about your projects..." : "Add API key..."}
                                        className="flex-1 px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-purple-500"
                                        disabled={isLoading}
                                    />
                                    <button onClick={sendMessage} disabled={isLoading || !inputMessage.trim()} className="px-6 py-3 bg-purple-600 text-white rounded-lg hover:bg-purple-700 disabled:opacity-50">
                                        <Send size={18} />
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>

                    {showSettingsModal && (
                        <div className="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50">
                            <div className="bg-white rounded-lg p-6 max-w-md w-full mx-4">
                                <h3 className="text-xl font-bold mb-4">Settings</h3>
                                <div className="space-y-4">
                                    <div>
                                        <label className="text-sm font-medium">Anthropic API Key</label>
                                        <input type="password" value={tempApiKey} onChange={(e) => setTempApiKey(e.target.value)} placeholder="sk-ant-api03-..." className="w-full px-4 py-2 border rounded-lg mt-1" />
                                        {apiKey && <p className="text-xs text-green-600 mt-1">✓ Configured</p>}
                                    </div>
                                    <div>
                                        <label className="text-sm font-medium">Email (for reminders)</label>
                                        <input type="email" value={tempEmail} onChange={(e) => setTempEmail(e.target.value)} placeholder="you@example.com" className="w-full px-4 py-2 border rounded-lg mt-1" />
                                        {userEmail && <p className="text-xs text-green-600 mt-1">✓ {userEmail}</p>}
                                    </div>
                                    {userEmail && (
                                        <button onClick={sendTestEmail} className="w-full px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700">
                                            Send Test Email Now
                                        </button>
                                    )}
                                </div>
                                <div className="flex gap-3 mt-6">
                                    <button onClick={() => { setShowSettingsModal(false); setTempApiKey(''); setTempEmail(''); }} className="flex-1 px-4 py-2 border rounded-lg">Cancel</button>
                                    <button onClick={() => { if (tempApiKey.trim()) saveApiKey(tempApiKey.trim()); if (tempEmail.trim()) saveEmail(tempEmail.trim()); setShowSettingsModal(false); setTempApiKey(''); setTempEmail(''); }} className="flex-1 px-4 py-2 bg-purple-600 text-white rounded-lg">Save</button>
                                </div>
                            </div>
                        </div>
                    )}

                    {showContextModal && (
                        <div className="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50">
                            <div className="bg-white rounded-lg p-6 max-w-2xl w-full mx-4 max-h-96 overflow-y-auto">
                                <div className="flex items-center justify-between mb-4">
                                    <h3 className="text-xl font-bold flex items-center gap-2">
                                        <Brain className="text-purple-600" />
                                        Context Memory
                                    </h3>
                                    <button onClick={() => setShowContextModal(false)} className="text-gray-500">✕</button>
                                </div>
                                {contextNotes.length === 0 ? (
                                    <p className="text-gray-400 text-center py-8">No context yet</p>
                                ) : (
                                    <div className="space-y-2">
                                        {contextNotes.map(note => (
                                            <div key={note.id} className="p-3 bg-purple-50 border border-purple-200 rounded-lg flex justify-between">
                                                <p className="text-sm flex-1">{note.content}</p>
                                                <button onClick={() => deleteContextNote(note.id)} className="text-red-600 ml-2">
                                                    <Trash2 size={16} />
                                                </button>
                                            </div>
                                        ))}
                                    </div>
                                )}
                            </div>
                        </div>
                    )}
                </>
            );
        };

        ReactDOM.render(<AssistantApp />, document.getElementById('root'));
    </script>
</body>
</html>
