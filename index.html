<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Task Manager</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif; }
        #root { height: 100vh; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        const CheckCircle2 = ({ size = 24, className = "" }) => (
            <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                <path d="M12 22c5.523 0 10-4.477 10-10S17.523 2 12 2 2 6.477 2 12s4.477 10 10 10z"/>
                <path d="m9 12 2 2 4-4"/>
            </svg>
        );

        const Circle = ({ size = 24, className = "" }) => (
            <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" className={className}>
                <circle cx="12" cy="12" r="10"/>
            </svg>
        );

        const Trash2 = ({ size = 24, className = "" }) => (
            <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                <path d="M3 6h18M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/>
            </svg>
        );

        const Send = ({ size = 24, className = "" }) => (
            <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                <path d="m22 2-7 20-4-9-9-4Z"/>
                <path d="M22 2 11 13"/>
            </svg>
        );

        const Loader2 = ({ size = 24, className = "" }) => (
            <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                <path d="M21 12a9 9 0 1 1-6.219-8.56"/>
            </svg>
        );

        const Sparkles = ({ size = 24, className = "" }) => (
            <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                <path d="m12 3-1.912 5.813a2 2 0 0 1-1.275 1.275L3 12l5.813 1.912a2 2 0 0 1 1.275 1.275L12 21l1.912-5.813a2 2 0 0 1 1.275-1.275L21 12l-5.813-1.912a2 2 0 0 1-1.275-1.275L12 3Z"/>
                <path d="M5 3v4M3 5h4M6 17v4M4 19h4"/>
            </svg>
        );

        const Bell = ({ size = 24, className = "" }) => (
            <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                <path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/>
                <path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/>
            </svg>
        );

        const Settings = ({ size = 24, className = "" }) => (
            <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                <path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/>
                <circle cx="12" cy="12" r="3"/>
            </svg>
        );

        const TaskManager = () => {
            const [tasks, setTasks] = useState([]);
            const [messages, setMessages] = useState([]);
            const [inputMessage, setInputMessage] = useState('');
            const [isLoading, setIsLoading] = useState(false);
            const [notificationsEnabled, setNotificationsEnabled] = useState(false);
            const [showApiKeyModal, setShowApiKeyModal] = useState(false);
            const [apiKey, setApiKey] = useState('');
            const [tempApiKey, setTempApiKey] = useState('');
            const messagesEndRef = useRef(null);

            useEffect(() => {
                loadData();
                checkNotificationPermission();
                const interval = setInterval(checkReminders, 60000);
                return () => clearInterval(interval);
            }, []);

            const loadData = () => {
                try {
                    const storedTasks = localStorage.getItem('ai-tasks');
                    const storedMessages = localStorage.getItem('ai-messages');
                    const storedApiKey = localStorage.getItem('anthropic-api-key');
                    
                    if (storedTasks) setTasks(JSON.parse(storedTasks));
                    if (storedApiKey) setApiKey(storedApiKey);
                    
                    if (storedMessages) {
                        setMessages(JSON.parse(storedMessages));
                    } else {
                        setMessages([{
                            role: 'assistant',
                            content: "Hi! I'm your AI personal assistant. I'll help you manage tasks, set priorities, and stay productive. You can chat with me naturally - tell me what you need to do, and I'll help organize everything!",
                            timestamp: new Date().toISOString()
                        }]);
                    }
                } catch (error) {
                    console.log('No existing data');
                }
            };

            const saveTasks = (newTasks) => {
                localStorage.setItem('ai-tasks', JSON.stringify(newTasks));
            };

            const saveMessages = (newMessages) => {
                localStorage.setItem('ai-messages', JSON.stringify(newMessages));
            };

            const saveApiKey = (key) => {
                localStorage.setItem('anthropic-api-key', key);
                setApiKey(key);
            };

            const checkNotificationPermission = () => {
                if ('Notification' in window) {
                    setNotificationsEnabled(Notification.permission === 'granted');
                }
            };

            const requestNotificationPermission = async () => {
                if ('Notification' in window) {
                    const permission = await Notification.requestPermission();
                    setNotificationsEnabled(permission === 'granted');
                }
            };

            const checkReminders = () => {
                const now = new Date();
                tasks.forEach(task => {
                    if (task.reminder && !task.completed) {
                        const reminderTime = new Date(task.reminder);
                        const diff = reminderTime - now;
                        if (diff > 0 && diff < 60000 && notificationsEnabled) {
                            new Notification('Task Reminder', {
                                body: task.title,
                                icon: '✓'
                            });
                        }
                    }
                });
            };

            const addTask = (taskData) => {
                const newTask = {
                    id: Date.now().toString(),
                    title: taskData.title,
                    priority: taskData.priority || 'medium',
                    dueDate: taskData.dueDate || null,
                    reminder: taskData.reminder || null,
                    category: taskData.category || 'General',
                    completed: false,
                    createdAt: new Date().toISOString()
                };
                const newTasks = [...tasks, newTask];
                setTasks(newTasks);
                saveTasks(newTasks);
                return newTask;
            };

            const toggleTask = (id) => {
                const newTasks = tasks.map(task =>
                    task.id === id ? { ...task, completed: !task.completed } : task
                );
                setTasks(newTasks);
                saveTasks(newTasks);
            };

            const deleteTask = (id) => {
                const newTasks = tasks.filter(task => task.id !== id);
                setTasks(newTasks);
                saveTasks(newTasks);
            };

            const sendMessage = async () => {
                if (!inputMessage.trim() || isLoading) return;

                if (!apiKey) {
                    setShowApiKeyModal(true);
                    return;
                }

                const userMessage = {
                    role: 'user',
                    content: inputMessage,
                    timestamp: new Date().toISOString()
                };

                const newMessages = [...messages, userMessage];
                setMessages(newMessages);
                saveMessages(newMessages);
                setInputMessage('');
                setIsLoading(true);

                try {
                    const taskContext = tasks.map(t => 
                        `- ${t.title} (${t.priority} priority, ${t.completed ? 'completed' : 'pending'}${t.dueDate ? ', due: ' + new Date(t.dueDate).toLocaleDateString() : ''})`
                    ).join('\n');

                    const systemPrompt = `You are a personal AI assistant helping with task management. 

Current tasks:
${taskContext || 'No tasks yet'}

When the user mentions tasks they need to do, respond with a JSON object in this exact format:
{
  "response": "Your conversational response here",
  "tasks": [
    {
      "title": "Task description",
      "priority": "high|medium|low",
      "dueDate": "YYYY-MM-DD" (optional),
      "category": "Category name"
    }
  ]
}

If the user is just chatting or asking questions (not creating tasks), respond with:
{
  "response": "Your helpful response here"
}

Be helpful, concise, and proactive. Offer productivity advice, help prioritize, and break down complex tasks.`;

                    const response = await fetch('https://api.anthropic.com/v1/messages', {
                        method: 'POST',
                        headers: {
    'Content-Type': 'application/json'
},
body: JSON.stringify({
    apiKey: apiKey,
    system: systemPrompt,
    messages: [
                                ...messages.filter(m => m.role !== 'system').slice(-10).map(m => ({
                                    role: m.role,
                                    content: m.content
                                })),
                                { role: 'user', content: inputMessage }
                            ]
                        })
                    });

                    const data = await response.json();
                    
                    if (data.error) {
                        throw new Error(data.error.message);
                    }

                    const aiResponse = data.content[0].text;

                    let parsedResponse;
                    try {
                        const cleanResponse = aiResponse.replace(/```json\n?|\n?```/g, '').trim();
                        parsedResponse = JSON.parse(cleanResponse);
                    } catch {
                        parsedResponse = { response: aiResponse };
                    }

                    if (parsedResponse.tasks && parsedResponse.tasks.length > 0) {
                        parsedResponse.tasks.forEach(taskData => {
                            addTask(taskData);
                        });
                    }

                    const assistantMessage = {
                        role: 'assistant',
                        content: parsedResponse.response,
                        timestamp: new Date().toISOString()
                    };

                    const updatedMessages = [...newMessages, assistantMessage];
                    setMessages(updatedMessages);
                    saveMessages(updatedMessages);

                } catch (error) {
                    console.error('AI Error:', error);
                    const errorMessage = {
                        role: 'assistant',
                        content: error.message.includes('api_key') 
                            ? "Your API key seems invalid. Please check it in settings."
                            : "I'm having trouble connecting right now. Please try again in a moment.",
                        timestamp: new Date().toISOString()
                    };
                    const updatedMessages = [...newMessages, errorMessage];
                    setMessages(updatedMessages);
                    saveMessages(updatedMessages);
                }

                setIsLoading(false);
            };

            useEffect(() => {
                messagesEndRef.current?.scrollIntoView({ behavior: 'smooth' });
            }, [messages]);

            const priorityColors = {
                high: 'bg-red-100 text-red-800 border-red-300',
                medium: 'bg-yellow-100 text-yellow-800 border-yellow-300',
                low: 'bg-green-100 text-green-800 border-green-300'
            };

            const pendingTasks = tasks.filter(t => !t.completed);
            const completedTasks = tasks.filter(t => t.completed);

            return (
                <>
                    <div className="flex h-screen bg-gray-50">
                        <div className="w-2/5 bg-white border-r border-gray-200 flex flex-col">
                            <div className="p-6 border-b border-gray-200">
                                <div className="flex items-center justify-between">
                                    <div>
                                        <h1 className="text-2xl font-bold text-gray-900 flex items-center gap-2">
                                            <CheckCircle2 size={24} className="text-blue-600" />
                                            My Tasks
                                        </h1>
                                        <p className="text-sm text-gray-600 mt-1">
                                            {pendingTasks.length} pending · {completedTasks.length} completed
                                        </p>
                                    </div>
                                    <button
                                        onClick={() => setShowApiKeyModal(true)}
                                        className="p-2 hover:bg-gray-100 rounded-lg"
                                        title="Settings"
                                    >
                                        <Settings size={20} className="text-gray-600" />
                                    </button>
                                </div>
                            </div>

                            <div className="flex-1 overflow-y-auto p-6 space-y-4">
                                {pendingTasks.length === 0 && completedTasks.length === 0 && (
                                    <div className="text-center py-12 text-gray-400">
                                        <Circle size={48} className="mx-auto mb-3" />
                                        <p>No tasks yet. Chat with your AI assistant to get started!</p>
                                    </div>
                                )}

                                {pendingTasks.length > 0 && (
                                    <div>
                                        <h3 className="text-xs font-semibold text-gray-500 uppercase mb-3">Pending</h3>
                                        {pendingTasks.map(task => (
                                            <div key={task.id} className={`mb-3 p-4 rounded-lg border-2 ${priorityColors[task.priority]}`}>
                                                <div className="flex items-start gap-3">
                                                    <button onClick={() => toggleTask(task.id)} className="mt-1">
                                                        <Circle size={20} />
                                                    </button>
                                                    <div className="flex-1">
                                                        <p className="font-medium">{task.title}</p>
                                                        <div className="flex gap-3 mt-2 text-xs">
                                                            {task.category && (
                                                                <span className="opacity-75">📁 {task.category}</span>
                                                            )}
                                                            {task.dueDate && (
                                                                <span className="opacity-75">📅 {new Date(task.dueDate).toLocaleDateString()}</span>
                                                            )}
                                                        </div>
                                                    </div>
                                                    <button onClick={() => deleteTask(task.id)} className="text-red-600 hover:text-red-800">
                                                        <Trash2 size={18} />
                                                    </button>
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                )}

                                {completedTasks.length > 0 && (
                                    <div>
                                        <h3 className="text-xs font-semibold text-gray-500 uppercase mb-3">Completed</h3>
                                        {completedTasks.map(task => (
                                            <div key={task.id} className="mb-3 p-4 rounded-lg border-2 border-gray-200 bg-gray-50">
                                                <div className="flex items-start gap-3">
                                                    <button onClick={() => toggleTask(task.id)} className="mt-1">
                                                        <CheckCircle2 size={20} className="text-green-600" />
                                                    </button>
                                                    <div className="flex-1">
                                                        <p className="font-medium line-through text-gray-500">{task.title}</p>
                                                    </div>
                                                    <button onClick={() => deleteTask(task.id)} className="text-red-600 hover:text-red-800">
                                                        <Trash2 size={18} />
                                                    </button>
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                )}
                            </div>

                            {!notificationsEnabled && (
                                <div className="p-4 bg-blue-50 border-t border-blue-200">
                                    <button
                                        onClick={requestNotificationPermission}
                                        className="w-full flex items-center justify-center gap-2 px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700"
                                    >
                                        <Bell size={18} />
                                        Enable Reminders
                                    </button>
                                </div>
                            )}
                        </div>

                        <div className="flex-1 flex flex-col bg-gradient-to-br from-blue-50 to-purple-50">
                            <div className="p-6 bg-white border-b border-gray-200">
                                <h2 className="text-xl font-bold text-gray-900 flex items-center gap-2">
                                    <Sparkles size={24} className="text-purple-600" />
                                    AI Personal Assistant
                                </h2>
                                <p className="text-sm text-gray-600 mt-1">
                                    {apiKey ? 'Chat naturally about your tasks and goals' : 'Add your API key in settings to enable AI'}
                                </p>
                            </div>

                            <div className="flex-1 overflow-y-auto p-6 space-y-4">
                                {messages.map((msg, idx) => (
                                    <div key={idx} className={`flex ${msg.role === 'user' ? 'justify-end' : 'justify-start'}`}>
                                        <div className={`max-w-lg p-4 rounded-lg ${
                                            msg.role === 'user' 
                                                ? 'bg-blue-600 text-white' 
                                                : 'bg-white border border-gray-200 text-gray-800'
                                        }`}>
                                            <p className="whitespace-pre-wrap">{msg.content}</p>
                                        </div>
                                    </div>
                                ))}
                                {isLoading && (
                                    <div className="flex justify-start">
                                        <div className="bg-white border border-gray-200 p-4 rounded-lg">
                                            <Loader2 size={24} className="animate-spin text-purple-600" />
                                        </div>
                                    </div>
                                )}
                                <div ref={messagesEndRef} />
                            </div>

                            <div className="p-6 bg-white border-t border-gray-200">
                                <div className="flex gap-3">
                                    <input
                                        type="text"
                                        value={inputMessage}
                                        onChange={(e) => setInputMessage(e.target.value)}
                                        onKeyPress={(e) => e.key === 'Enter' && sendMessage()}
                                        placeholder={apiKey ? "Tell me what you need to do..." : "Add API key in settings to chat..."}
                                        className="flex-1 px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-purple-500"
                                        disabled={isLoading}
                                    />
                                    <button
                                        onClick={sendMessage}
                                        disabled={isLoading || !inputMessage.trim()}
                                        className="px-6 py-3 bg-purple-600 text-white rounded-lg hover:bg-purple-700 disabled:opacity-50 disabled:cursor-not-allowed flex items-center gap-2"
                                    >
                                        <Send size={18} />
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>

                    {showApiKeyModal && (
                        <div className="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50">
                            <div className="bg-white rounded-lg p-6 max-w-md w-full mx-4">
                                <h3 className="text-xl font-bold mb-4">API Settings</h3>
                                <p className="text-sm text-gray-600 mb-4">
                                    Enter your Anthropic API key to enable AI features. Get one at{' '}
                                    <a href="https://console.anthropic.com" target="_blank" rel="noopener noreferrer" className="text-blue-600 hover:underline">
                                        console.anthropic.com
                                    </a>
                                </p>
                                <input
                                    type="password"
                                    value={tempApiKey}
                                    onChange={(e) => setTempApiKey(e.target.value)}
                                    placeholder="sk-ant-api03-..."
                                    className="w-full px-4 py-2 border border-gray-300 rounded-lg mb-4 focus:outline-none focus:ring-2 focus:ring-purple-500"
                                />
                                {apiKey && (
                                    <p className="text-sm text-green-600 mb-4">✓ API key is configured</p>
                                )}
                                <div className="flex gap-3">
                                    <button
                                        onClick={() => {
                                            setShowApiKeyModal(false);
                                            setTempApiKey('');
                                        }}
                                        className="flex-1 px-4 py-2 border border-gray-300 rounded-lg hover:bg-gray-50"
                                    >
                                        Cancel
                                    </button>
                                    <button
                                        onClick={() => {
                                            if (tempApiKey.trim()) {
                                                saveApiKey(tempApiKey.trim());
                                            }
                                            setShowApiKeyModal(false);
                                            setTempApiKey('');
                                        }}
                                        className="flex-1 px-4 py-2 bg-purple-600 text-white rounded-lg hover:bg-purple-700"
                                    >
                                        Save
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}
                </>
            );
        };

        ReactDOM.render(<TaskManager />, document.getElementById('root'));
    </script>
</body>
</html>
